[pytest]
# RULING 59 res.1 (2026-08-01) - THE DOCUMENTED SCOPE IS THE ENFORCED SCOPE.
#
# `tests/conftest.py`'s autouse isolation fixture covers the `tests/` subtree
# and only that subtree. Without this key, a bare `pytest` collected from the
# repo root, which pulled in `scripts/` - demo scripts that EXECUTE AUREA AT
# IMPORT TIME against real default paths. One such invocation wrote twelve
# files into shared `data/runtime/`, including the runtime scar store and
# `sae_epoch.json`, the Self-Mutation Ceiling's durable state.
#
# So the isolation contract was real and its SCOPE was a convention: it held
# exactly as long as everyone remembered to type the path. That is the
# "discouraged, not unexecutable" shape CLAUDE.md section 3 exists for, and it
# was sitting under the suite that enforces the rest of the architecture.
#
# With this key, bare `pytest` collects exactly what `pytest tests/` collects.
# The method register is not amended; the ENVIRONMENT is fixed to match it.
#
# ONE KEY, NOTHING SPECULATIVE. No addopts, no markers, no coverage gate - each
# of those is a separate decision, and CI is deliberately minimal (CLAUDE.md
# section 4). Adding one is a ruling, not a convenience.
testpaths = tests
